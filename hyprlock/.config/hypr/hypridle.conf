general {
    lock_cmd = pidof hyprlock || /usr/bin/hyprlock
    unlock_cmd = pkill -SIGUSR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = swaymsg "output * power on"
    inhibit_sleep = 3
}

# 60s after last activity, power off only if already locked
# (covers a manual $mod+l lock, which happens before the 300s timer)
listener {
    timeout = 60
    on-timeout = pgrep -x hyprlock >/dev/null && swaymsg "output * power off"
    on-resume = pgrep -x hyprlock >/dev/null && swaymsg "output * power on"
}

# 300s idle: lock, through loginctl so lock_cmd is the one guarded path
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 360s idle: power off, power back on on activity
listener {
    timeout = 360
    on-timeout = swaymsg "output * power off"
    on-resume = swaymsg "output * power on"
}
