### Output configuration
# Requires: desktop-backgrounds-compat, swaybg, jxl-pixbuf-loader
output * bg /usr/share/wallpapers/Mountain/contents/images_dark/5120x2880.png fill

# Built-in monitor
output "eDP-1" {
    mode  1920x1080@120.003Hz
    pos 3072 1186
    transform normal
    scale 1.0
    scale_filter nearest
    adaptive_sync on
    dpms on
}

output "HDMI-A-1" {
    mode  3840x2160@120.0Hz
    pos 0 0
    transform normal
    scale 1.25
    scale_filter linear
    adaptive_sync on
    dpms on
}

 exec_always "pkill kanshi; exec kanshi"
